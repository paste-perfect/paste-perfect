name: Set up project
description: Use the pinned Node version and install the exact dependency lockfile.
inputs:
  directory:
    description: Checked-out project directory
    default: .
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ${{ inputs.directory }}/.node-version
        cache: npm
        cache-dependency-path: ${{ inputs.directory }}/package-lock.json
    - name: Use the declared npm version
      working-directory: ${{ inputs.directory }}
      shell: bash
      run: |
        npm_spec=$(node -p 'require("./package.json").packageManager')
        if [ "npm@$(npm --version)" != "$npm_spec" ]; then
          npm install --global "$npm_spec" --no-audit --fund=false
        fi
    - run: npm ci --no-audit --fund=false
      working-directory: ${{ inputs.directory }}
      shell: bash
