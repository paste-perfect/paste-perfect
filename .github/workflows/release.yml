name: Release validated commit
on:
  workflow_run:
    workflows: ["CI — Test, Lint & Build"]
    branches: [main, dev]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: delivery-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  release:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      statuses: write
    outputs:
      preview_sha: ${{ github.event.workflow_run.head_branch == 'dev' && steps.current.outputs.deploy == 'true' && github.event.workflow_run.head_sha || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Ignore superseded commits
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)
          echo "deploy=$([ "$latest" = "$TESTED_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Mark preview verification pending
        if: steps.current.outputs.deploy == 'true' && github.event.workflow_run.head_branch == 'dev'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.payload.workflow_run.head_sha,
              context: 'Preview verified', state: 'pending',
              description: 'Waiting for deployment and live browser checks',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - uses: ./.github/actions/setup
        if: steps.current.outputs.deploy == 'true'
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.current.outputs.deploy == 'true'
        id: token
        with:
          client-id: ${{ secrets.RELEASEBOT_APP_ID }}
          private-key: ${{ secrets.RELEASEBOT_PRIVATE_KEY }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.current.outputs.deploy == 'true'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: ${{ github.event.workflow_run.head_branch == 'dev' && 'preview' || 'production' }}
          path: site
      - name: Verify artifact provenance
        if: steps.current.outputs.deploy == 'true'
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_TARGET: ${{ github.event.workflow_run.head_branch == 'dev' && 'preview' || 'production' }}
        run: node scripts/verify-artifact.mjs site
      - name: Publish semantic release
        if: steps.current.outputs.deploy == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          export GITHUB_REF="refs/heads/$RELEASE_BRANCH"
          export GITHUB_SHA="$RELEASE_SHA"
          export GITHUB_EVENT_NAME=push
          npx semantic-release
      - name: Record the released version
        if: steps.current.outputs.deploy == 'true'
        run: node scripts/stamp-release.mjs site
      - name: Deploy preview
        if: steps.current.outputs.deploy == 'true' && github.event.workflow_run.head_branch == 'dev'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          repository-name: paste-perfect/paste-perfect-test
          branch: gh-pages
          folder: site
          clean: true
          ssh-key: ${{ secrets.DEPLOY_KEY_PREVIEW }}
      - name: Deploy production
        if: steps.current.outputs.deploy == 'true' && github.event.workflow_run.head_branch == 'main'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          token: ${{ steps.token.outputs.token }}
          branch: gh-pages
          folder: site
          clean: true

  verify-preview:
    needs: release
    if: needs.release.outputs.preview_sha != ''
    uses: ./.github/workflows/verify-preview.yml
    with:
      expected_sha: ${{ needs.release.outputs.preview_sha }}

  preview-status:
    needs: [release, verify-preview]
    if: always() && needs.release.outputs.preview_sha != ''
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_SHA: ${{ needs.release.outputs.preview_sha }}
          VERIFIED: ${{ needs.release.result == 'success' && needs.verify-preview.result == 'success' }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.PREVIEW_SHA,
              context: 'Preview verified', state: process.env.VERIFIED === 'true' ? 'success' : 'failure',
              description: 'Preview deployment and live browser verification',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
