name: Maintain dependency PRs
on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: dependency-maintenance-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  prepare:
    name: Repair lockfile and apply migrations
    # Renovate PRs and the reverse-sync PR only: their branches are written by automation, never by people.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository && (
        (github.event.pull_request.user.login == 'renovate[bot]' && startsWith(github.event.pull_request.head.ref, 'renovate/')) ||
        (github.event.pull_request.user.login == 'paste-perfect-releasebot[bot]' && github.event.pull_request.head.ref == 'automation/main-to-dev-sync')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    # Runs dependency code (install scripts, framework migrations), so it never receives a write credential.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # Regenerates package-lock.json when Renovate's artifact update failed or a branch merge combined two lockfiles.
      - uses: ./.github/actions/setup
        with:
          lockfile: repair
      - name: Apply in-range fixes when the critical audit gate would fail
        run: |
          if ! npm audit --audit-level=critical > /dev/null; then
            npm audit fix --ignore-scripts --fund=false || echo "::warning::npm audit fix could not resolve every advisory; validation reports what remains."
          fi
      - run: node scripts/framework-migrations.mjs
      - id: patch
        run: |
          git add --all
          git diff --cached --stat
          git diff --cached --binary --no-renames > "$RUNNER_TEMP/maintenance.patch"
          if [ -s "$RUNNER_TEMP/maintenance.patch" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.patch.outputs.changed == 'true'
        with:
          name: maintenance-patch
          path: ${{ runner.temp }}/maintenance.patch
          retention-days: 1

  commit:
    name: Commit maintenance changes
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Fresh runner that executes nothing from the PR or its dependencies; the patch is untrusted data.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maintenance-patch
          path: ${{ runner.temp }}/maintenance
      - name: Apply the patch to dependency and migration paths only
        run: |
          git -c core.hooksPath=/dev/null apply --index "$RUNNER_TEMP/maintenance/maintenance.patch"
          disallowed=$(git diff --cached --name-only --no-renames | grep -Ev '^(src/|config/|angular\.json$|package\.json$|package-lock\.json$|tsconfig[^/]*\.json$)' || true)
          if [ -n "$disallowed" ]; then
            echo "::error::Maintenance patch touches paths outside its scope:"
            echo "$disallowed"
            exit 1
          fi
          git diff --cached --stat
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          client-id: ${{ secrets.RELEASEBOT_APP_ID }}
          private-key: ${{ secrets.RELEASEBOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit to the dependency PR
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$PR_BRANCH" --jq .object.sha)
          if [ "$current" != "$EXPECTED_SHA" ]; then
            echo "Branch advanced; the run for the new head maintains it."
            exit 0
          fi
          name="$APP_SLUG[bot]"
          email="$(gh api "users/$name" --jq .id)+$name@users.noreply.github.com"
          # Sync merges share this author, so recognize a previous maintenance commit by its subject.
          if [ "$(git log -1 --format=%ae)" = "$email" ] && git log -1 --format=%s | grep -Eq '^chore\(deps\): (regenerate lockfile|apply framework migrations)'; then
            echo "::error::The previous maintenance commit did not converge; inspect the changes above."
            exit 1
          fi
          lockfile=$(git diff --cached --name-only -- package-lock.json)
          others=$(git diff --cached --name-only -- . ':!package-lock.json')
          if [ -n "$lockfile" ] && [ -n "$others" ]; then
            message='chore(deps): regenerate lockfile and apply framework migrations'
          elif [ -n "$lockfile" ]; then
            message='chore(deps): regenerate lockfile'
          else
            message='chore(deps): apply framework migrations'
          fi
          git -c core.hooksPath=/dev/null -c user.name="$name" -c user.email="$email" commit -m "$message"
          gh auth setup-git
          git push "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$PR_BRANCH"
