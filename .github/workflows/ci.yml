name: CI — Test, Lint & Build

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, dev]
  merge_group:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Generate Linux visual and clipboard baselines for review
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    name: Lint PR Title (Conventional Commits)
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint & Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run lint:check
      - run: npm run format:check
      - run: npm run test:automation
      - name: Verify framework migrations are committed
        run: |
          node scripts/framework-migrations.mjs
          git diff --exit-code

  lockfile-integrity:
    name: Lockfile Integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: git diff --exit-code -- package-lock.json
      - run: npm ls --all > /dev/null
      - run: npm audit signatures
      - run: npm audit --audit-level=critical

  build:
    name: Build (production)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run build-prod
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production
          include-hidden-files: true
          path: dist/paste-perfect/browser
          if-no-files-found: error
          retention-days: 7
      - run: npm run build-preview
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview
          include-hidden-files: true
          path: dist/paste-perfect/browser
          if-no-files-found: error
          retention-days: 7

  test:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run test:unit:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && hashFiles('reports/vitest/**') != '' }}
        with:
          name: unit-reports
          path: reports/vitest/
          retention-days: 7

  snapshots:
    name: Snapshot Tests (Playwright)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production
          path: dist/paste-perfect/browser
      - name: Test the production artifact
        run: npx playwright test --config=config/tests/playwright.production.config.ts
      - run: npm run test:snapshots:ci
        if: ${{ !inputs.update_snapshots }}
      - run: npm run test:snapshots:ci -- --update-snapshots
        if: ${{ inputs.update_snapshots }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.update_snapshots }}
        with:
          name: visual-baselines
          path: |
            src/tests/snapshot-tests/snapshots/
            src/tests/snapshot-tests/test-data/dark-tabs/
            src/tests/snapshot-tests/test-data/light-spaces/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && hashFiles('reports/playwright/**') != '' }}
        with:
          name: browser-reports
          path: reports/playwright/
          retention-days: 7

  security:
    name: Trivy — Filesystem Vulnerability Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  gate:
    name: CI Gate
    runs-on: ubuntu-24.04
    needs: [pr-title, lint, lockfile-integrity, build, test, snapshots, security]
    if: always()
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots }}
        run: |
          if [ "$UPDATE_SNAPSHOTS" = "true" ]; then echo "Baseline generation requires review and a new normal CI run."; exit 1; fi
          node -e 'const jobs = JSON.parse(process.env.RESULTS); for (const [name, job] of Object.entries(jobs)) { if (name === "pr-title" && process.env.EVENT_NAME !== "pull_request") continue; if (job.result !== "success") { console.error(name + ": " + job.result); process.exitCode = 1; } }'
