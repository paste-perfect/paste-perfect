name: CI — Test, Lint & Build
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Generate Linux visual and clipboard baselines for review
        type: boolean
        default: false
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validation.yml
    with:
      update_snapshots: ${{ inputs.update_snapshots || false }}
  gate:
    name: Branch validation
    needs: validate
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          VALIDATION: ${{ needs.validate.result }}
        run: test "$VALIDATION" = success
