name: Security — Vulnerability Scan (Trivy)

# Keeps the Security tab current for dev and main; the required CI scan gates pull requests.
# Pushes report each new commit, and the weekly run catches advisories published for unchanged code.
on:
  push:
    branches: [dev, main]
  schedule:
    - cron: "0 4 * * 0" # Every Sunday at 04:00 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions: {} # declared per-job

jobs:
  trivy-fs-scan:
    name: Vulnerability report
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          format: "sarif"
          output: "trivy-results-fs.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          ignore-unfixed: true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ !cancelled() && hashFiles('trivy-results-fs.sarif') != '' }}
        with:
          sarif_file: "trivy-results-fs.sarif"
          # Alerts close only when a later upload in the same category omits them. The default category is derived
          # from the workflow file and job names, so renaming either would strand every open alert; keep this fixed.
          category: trivy-fs

      - name: Upload raw results as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('trivy-results-fs.sarif') != '' }}
        with:
          name: trivy-fs-results-${{ github.run_id }}
          path: trivy-results-fs.sarif
          retention-days: 14
