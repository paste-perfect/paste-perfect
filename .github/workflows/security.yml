name: Security — Vulnerability Scan (Trivy)

# Scheduled vulnerability reporting supplements the required CI scan.
on:
  schedule:
    - cron: "0 4 * * 0" # Every Sunday at 04:00 UTC
  workflow_dispatch:

# Cancel stale runs per PR; use run_id as fallback for scheduled/dispatch so
# those never cancel each other.
concurrency:
  group: security-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {} # declared per-job

jobs:
  trivy-fs-scan:
    name: Trivy — Filesystem Vulnerability Scan
    runs-on: ubuntu-latest
    # Skip draft PRs — only scan when the PR is ready for review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          format: "sarif"
          output: "trivy-results-fs.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          ignore-unfixed: true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: ${{ !cancelled() && hashFiles('trivy-results-fs.sarif') != '' }}
        with:
          sarif_file: "trivy-results-fs.sarif"

      - name: Upload raw results as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && hashFiles('trivy-results-fs.sarif') != '' }}
        with:
          name: trivy-fs-results-${{ github.run_id }}
          path: trivy-results-fs.sarif
          retention-days: 14
